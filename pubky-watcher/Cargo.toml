[package]
name = "pubky-watcher"
version = "0.1.0"
edition = "2021"
publish = false
description = "Read events from Pubky homeservers"
homepage = "https://github.com/pubky/pubky-nexus"
repository = "https://github.com/pubky/pubky-nexus"
license = "MIT"
readme = "README.md"

[dependencies]
async-trait = { workspace = true }
bytes = "1"
futures = { workspace = true }
pubky = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["stream"] }
thiserror = { workspace = true }
tokio = { version = "1", features = ["rt", "sync", "time"] }
tracing = { workspace = true }

[dev-dependencies]
http = "1"
tokio = { workspace = true, features = ["test-util"] }
tracing-test = { workspace = true }
