# The public IP address where the Nexus API endpoint can be reached from the outside
public_ip = "127.0.0.1"
# The local IP and port to which the HTTP server will bind and listen on
# This HTTP endpoint can be used for the ICANN DNS-based TLS setup, for example via a reverse proxy
public_addr = "127.0.0.1:8080"
# The local IP and port to which the HTTPS (Pkarr TLS) server will bind and listen on
pubky_listen_socket = "127.0.0.1:8081"
# Time (in seconds) before a request is aborted with a 408 Request Timeout; values below 1 are clamped to 1
request_timeout_secs = 30
# Maximum size (in bytes) accepted for a request body
max_body_size_bytes = 1048576

[rate_limit]
# Enable rate limiting (disabled by default for permissiveness behind NATs)
enabled = false
# Trust forwarded-IP headers (X-Forwarded-For / X-Real-IP) for real-IP extraction.
# Only enable behind a known reverse proxy — clients can spoof these headers otherwise.
# trust_proxy_headers = false
# Default bucket for standard endpoints (300 req/min, burst 50)
[rate_limit.default_bucket]
rate = 300
burst = 50
# Expensive bucket for high-cost endpoints (20 req/min, burst 5)
[rate_limit.expensive_bucket]
rate = 20
burst = 5

# App features. Keep them the same in every service.
[features]
# Hide posts by authors outside the trust ranking from the streams every viewer
# shares. A change applies when nexusd starts, or at the next trust recompute.
hide_unranked_authors = true

[stack]
# Logging, options: error, warn, info, debug and trace
log_level = "info"
files_path = "~/.pubky-nexus/static/files"

[stack.net]
testnet = false
# testnet host, leave as "localhost" for local development. Change only if the
# testnet homeserver/relay are on another machine (e.g. Docker setups).
testnet_host = "localhost"
# Total request timeout in seconds for all HTTP requests made by the shared Pubky client.
# This includes response-body reads and should accommodate max_file_size blob downloads.
pubky_http_request_timeout_secs = 300
# External HS PKs which are forbidden from being indexed
external_hs_pk_blacklist = []

[stack.otlp]
# Service name used for tracing, logging, and metrics in OpenTelemetry
name = "nexus-webapi"
# OTLP endpoint is not set by default. To export logs, traces, and metrics,
# set it to an OpenTelemetry Collector endpoint.
#endpoint = "http://localhost:4317"
# Optional resource attributes attached to all OTLP signals
# [stack.otlp.resource_attributes]
# "host.name" = "nexus-1"
# "deployment.environment.name" = "local"

[stack.db]
redis = "redis://127.0.0.1:6379"
# Maximum time (ms) RediSearch spends on a single FT.SEARCH before returning partial results
#ft_search_timeout_ms = 50

[stack.db.neo4j]
uri = "bolt://localhost:7687"
# Not needed in the Community Edition the profile username, just the password
#user = "neo4j"
password = "12345678"
# Queries taking longer than this (ms) will be logged as warnings. Remove or comment out this line to disable.
slow_query_logging_threshold_ms = 100
# Include the Cypher query text in slow query log entries
#slow_query_logging_include_cypher = false

[stack.media]
# Maximum number of concurrent media processing subprocesses (ImageMagick/ffmpeg).
# Defaults to the number of available CPU cores (minimum 4). Must be greater than 0.
# ImageMagick and ffmpeg already thread internally, so on large hosts a high value oversubscribes
# CPU (each concurrent convert can itself use several cores). cores/2 is a sensible starting point.
# Image conversions run `identify` then `convert` under one permit, each with its own deadline, so
# worst-case permit hold is 2x process_timeout_secs.
#max_concurrency = 4
# Wall-clock deadline (seconds) for a single ImageMagick/ffmpeg subprocess. Past it the process
# group is killed and reaped so its concurrency slot is returned. Keep it above ImageMagick's own
# time limit (30s in the Docker image, see docker/imagemagick/policy.xml): it is a backstop for
# children that hang without burning CPU. Must be greater than 0.
# Two upper bounds to respect:
# - Keep it below the API request timeout (`request_timeout_secs` above, default 30s) if
#   clients of slow conversions should receive the result instead of a 408; work still publishes
#   after a request timeout, but the caller of that request gets 408 either way.
# - Keep it under the 1h temp-file sweep (stale files in .tmp are deleted after 1 hour); a longer
#   deadline lets the sweep delete an in-flight conversion's temp file and fail its rename.
#process_timeout_secs = 180
