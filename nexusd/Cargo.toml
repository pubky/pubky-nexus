[package]
name = "nexusd"
version.workspace = true
publish.workspace = true
edition = "2021"
description = "Nexus daemon"
homepage = "https://github.com/pubky/pubky-nexus"
repository = "https://github.com/pubky/pubky-nexus"
license = "MIT"

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true, features = ["derive"] }
cron = { workspace = true }
futures = { workspace = true }
# `mock` is needed for the `nexusd db clear` and `nexusd db mock` subcommands.
nexus-webapi = { path = "../nexus-webapi", features = ["mock"] }
nexus-common = { path = "../nexus-common" }
opentelemetry = { workspace = true }
pubky-social-specs = { workspace = true }
redis = { workspace = true, features = ["tokio-comp"] }
nexus-watcher = { path = "../nexus-watcher" }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
anyhow = { workspace = true }
tokio-shared-rt = { workspace = true }
tempfile = { workspace = true }
tracing-test = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["testing"] }
serde_json = { workspace = true }
